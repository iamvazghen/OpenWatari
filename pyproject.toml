[project]
name = "afon"
version = "0.0.1"
description = "OpenAfon — an open-source framework for building your own 24/7, voice-first, multi-device AI companion (Afon)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["voice-assistant", "pipecat", "speech", "tts", "stt", "wake-word", "llm-agent", "self-hosted"]

# Base deps shared by edge + brain. Provider-specific heavy deps live in optional groups
# so a CPU-only edge install doesn't pull GPU/cloud stacks it won't use.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "rich>=13.0",            # the setup wizard's terminal UI (degrades to plain text if missing)
]

[project.scripts]
afon-setup = "afon.setup_wizard:main"

[project.optional-dependencies]
# The real-time voice pipeline (edge). Pinned in Phase 0; providers added per-phase.
edge = [
    "pipecat-ai[silero,webrtc]>=0.0.90",
    "pyaudio>=0.2.11",          # local mic/speaker transport (pipecat.transports.local.audio)
    "textual>=0.79",
    "pycaw>=20240210; sys_platform == 'win32'",   # master volume / mute (42.F3) — the speakers are here
]
# Cloud voice providers (default for quality per user decision): ElevenLabs TTS + Deepgram STT.
cloud-voice = [
    "pipecat-ai[elevenlabs,deepgram]>=0.0.90",
]
# Local CPU-friendly fallbacks (Phase 1): wake word + local STT/TTS.
# Local STT: faster-whisper (multilingual) + moonshine-onnx (English, ~3x faster, STT_PROVIDER=moonshine).
local-voice = [
    "openwakeword>=0.6",
    "pipecat-ai[whisper,piper]>=0.0.90",
    "kokoro-onnx>=0.4",
    "useful-moonshine-onnx>=2025.11",
]
# The 24/7 orchestrator (brain): own LLM + FastAPI + OpenClaw bridge + scheduler + channels.
brain = [
    "openai>=1.40",            # OpenAI-compatible client -> freellmapi (Afon's own LLM)
    "tzdata>=2024.1",          # IANA tz db (Windows has none) for Europe/Berlin scheduling
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",         # SQLite jobstore so reminders survive a restart (Phase 4)
    "yt-dlp>=2024.8",          # resolve a song -> YouTube video for free playback (no Premium)
    "ytmusicapi>=1.7",         # YouTube Music search (music-tuned, free) — the Spotify replacement
    "redis>=5.0",              # L4 hot-cache backend (Phase 9b); graceful no-op if unreachable
]
# Vision (LAPTOP-SIDE ONLY — the VPS is cameraless and pc_agent routes every camera op here).
#
# `opencv-python` was previously an UNDECLARED runtime dependency: camera.py imports cv2 and
# logs a warning if it is absent, so a fresh install got a camera that silently did nothing.
#
# `uniface` supplies real face recognition. What it replaces was a hand-rolled 256-bin LBP
# histogram compared by intersection — a texture signature, chosen to avoid a dependency, and
# weak exactly where owner-identification needs strength: pose, expression and lighting change
# it, and it cannot tell a face from a photograph of that face. uniface brings ArcFace/AdaFace
# embeddings, RetinaFace/SCRFD detection and MiniFASNet anti-spoofing, on onnxruntime, which
# was already installed. Kept optional: nothing on the brain needs it.
vision = [
    "opencv-python>=4.9",
    "uniface>=3.7",
]
# Phase 3 channels: Telethon user-client to READ unread Telegram DMs (Bot API can't).
channels = [
    "telethon>=1.36",
    "py-tgcalls>=2.3",        # stream music INTO a Telegram group voice chat (plays on the phone)
]
# Phase 3 interactive browsing: Playwright drives a Browserbase headless Chrome over CDP.
# (web_search/scrape_url/Spotify/vault need nothing here — they're plain httpx/filesystem.)
browse = [
    "playwright>=1.47",
]
# Phase 5 speaker biometrics: SpeechBrain ECAPA voiceprint (pulls torch — opt-in only).
identity = [
    "pyaudio>=0.2.11",          # mic capture for bench/enroll_voice.py
    "speechbrain>=1.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "soxr>=0.3",                # resample live mic (44.1/48k) -> 16k for ECAPA (speaker_id.embed)
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
